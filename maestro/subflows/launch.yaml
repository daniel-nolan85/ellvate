appId: com.llvcommunity.app
---
- launchApp
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "http://localhost:8081"
    file: ../subflows/select-dev-server.yaml
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Continue"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Continue"
    file: ../subflows/continue-dev-menu.yaml
- runFlow:
    when:
      visible: "Go home"
    file: ../subflows/close-dev-menu.yaml
- extendedWaitUntil:
    visible: "Get started"
    timeout: 30000

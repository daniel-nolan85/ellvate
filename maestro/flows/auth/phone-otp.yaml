appId: com.llvcommunity.app
tags:
  - auth
  - full
---
- runFlow: ../../subflows/reset-state.yaml
- runFlow: ../../subflows/launch.yaml
- tapOn: "Get started"
- tapOn:
    id: auth-kind-phone
- tapOn:
    id: auth-identifier-input
- inputText: ${MAESTRO_TEST_PHONE}
- pressKey: BACK
- tapOn: "Continue"
- assertVisible: "Check your messages"
- tapOn:
    id: auth-code-input
- inputText: ${MAESTRO_TEST_CODE}
- assertVisible: "Who are you here as?"
